name: Bug report
description: Report a reproducible problem using synthetic evidence.
body:
  - type: markdown
    attributes:
      value: "Never post keys, private traces or proprietary code. Use SECURITY.md for vulnerabilities; this form is public."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the intended requirement and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Commands and a small synthetic case; identify import, review, fixture execution, UI, export or AI suggestions.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Fail2Test commit/version, Python, OS and relevant framework/provider profile (never its key).
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Execution status and error code
      description: Include complete/fail, incomplete or tooling error where applicable. Review diagnostic output before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: I removed credentials, private evidence and proprietary source from this public report.
          required: true
